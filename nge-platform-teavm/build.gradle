plugins {
    id 'java-library'
    id "war"
    id "org.teavm" version "0.14.1"
    id "com.github.node-gradle.node" version "7.1.0" 
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit4
    testImplementation "org.teavm:teavm-junit:0.14.1"
 
    api project(':nge-platform-common')
    testImplementation teavm.libs.jsoApis
}

node {
    version = "22.18.0"
    download = true
    nodeProjectDir = file("${project.projectDir}")
}

task npmCi(type: com.github.gradle.node.npm.task.NpmTask) {
    args = ['ci']
}

task webpack(type: com.github.gradle.node.npm.task.NpxTask) {
    dependsOn npmCi
    command = "webpack"
    args = ["--config", "webpack.config.js"]
    
    doFirst {
        println "Running webpack with Node.js from: ${node.nodeProjectDir}"
        println "Using webpack from npm modules"
    }
}

task copyWebpackOutput(type: Copy) {
    dependsOn webpack
    from "${buildDir}/webpack-output"
    into "src/main/resources"
    
    doFirst {
        file("${buildDir}/webpack-output").mkdirs()
    }
}

processResources {
    dependsOn copyWebpackOutput
}

tasks.named('sourcesJar') {
    dependsOn copyWebpackOutput
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11) 
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

tasks.named('test') {
    useJUnit()
    // Compile every TeaVM JUnit test through both browser backends. TeaVM
    // 0.14.1 exposes the Wasm GC test DSL but does not forward it to the test
    // worker, so keep the explicit runner properties until that is fixed.
    systemProperty 'teavm.junit.target', "${buildDir}/js-tests"
    systemProperty 'teavm.junit.js', 'true'
    systemProperty 'teavm.junit.js.runner', System.getProperty('teavm.junit.js.runner', 'browser-chrome')
    systemProperty 'teavm.junit.wasm-gc', 'true'
    systemProperty 'teavm.junit.wasm-gc.runner', System.getProperty('teavm.junit.wasm-gc.runner', 'browser-chrome')
    doFirst {
        def jsModuleTests = [
            "TeaVMBackendParityTest",
            "TeaVMSecp256k1Test",
            "TeaVMWebsocketTransportUnitTest"
        ]
        ["js", "wasm-gc"].each { backend ->
            jsModuleTests.each { testClass ->
                file(
                    "${buildDir}/js-tests/${backend}/org/ngengine/platform/teavm/${testClass}/org/ngengine/platform/teavm"
                ).mkdirs()
            }
        }
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(11)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

tasks.register('teaVMBackendParity') {
    group = "verification"
    description = "Verifies that the TeaVM platform passes parity vectors as both JavaScript and WebAssembly GC"
    dependsOn tasks.named('test')

    doLast {
        def testPath = "org/ngengine/platform/teavm/TeaVMBackendParityTest"
        def jsOutput = file("${buildDir}/js-tests/js/${testPath}/classTest.js")
        def wasmOutput = file("${buildDir}/js-tests/wasm-gc/${testPath}/classTest.wasm")
        if (!jsOutput.isFile() || jsOutput.length() == 0) {
            throw new GradleException("TeaVM JavaScript parity artifact was not produced: ${jsOutput}")
        }
        if (!wasmOutput.isFile() || wasmOutput.length() < 4) {
            throw new GradleException("TeaVM Wasm GC parity artifact was not produced: ${wasmOutput}")
        }
        byte[] magic = new byte[4]
        wasmOutput.withInputStream { stream ->
            if (stream.read(magic) != magic.length) {
                throw new GradleException("Could not read the Wasm GC parity artifact header: ${wasmOutput}")
            }
        }
        if (!java.util.Arrays.equals(magic, [0x00, 0x61, 0x73, 0x6d] as byte[])) {
            throw new GradleException("Invalid WebAssembly binary header: ${wasmOutput}")
        }
        println "TeaVM backend parity verified: JavaScript ${jsOutput.length()} bytes, Wasm GC ${wasmOutput.length()} bytes"
    }
}

tasks.named('check') {
    dependsOn tasks.named('teaVMBackendParity')
}
