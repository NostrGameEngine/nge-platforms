plugins {
    id 'java-library'
}

def libdatachannelJavaIosOverride = findProperty('libdatachannelJavaIosOverride')?.toString()

dependencies {
    api project(':nge-platform-common')
    testImplementation libs.junit4
    // Local unit tests run on the host JVM, so they need desktop JNI libraries.
    // Keep them test-only: iOS applications still receive the iOS native framework.
    testRuntimeOnly libs.saferallocNativesLinuxX64
    testRuntimeOnly libs.saferallocNativesLinuxArm64
    testRuntimeOnly libs.saferallocNativesWindowsX64
    testRuntimeOnly libs.saferallocNativesMacosX64
    testRuntimeOnly libs.saferallocNativesMacosArm64
    implementation libs.gson
    implementation libs.bcprov
    implementation libs.libdatachannelJava
    implementation(libdatachannelJavaIosOverride ?: libs.libdatachannelJavaIos)
    implementation libs.libjgliosCoreIos
    implementation libs.saferalloc
    implementation libs.saferallocNativesIos
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}
